services:
  order-db:
    image: mariadb:11.4
    command:
      - mariadbd
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-legacy-event-pos=1
      - --log-bin-compress=0
    environment:
      MARIADB_ROOT_PASSWORD: local_demo_root_password
      MARIADB_DATABASE: order_db
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - order-db-data:/var/lib/mysql
      - ./mariadb/order/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  order-db-init:
    image: mariadb:11.4
    depends_on:
      order-db:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: local_demo_root_password
    volumes:
      - ./mariadb/order/init.sql:/sql/init.sql:ro
      - ./mariadb/order/migrate.sql:/sql/migrate.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mariadb -h order-db -uroot -p"$$MARIADB_ROOT_PASSWORD" < /sql/init.sql
        mariadb -h order-db -uroot -p"$$MARIADB_ROOT_PASSWORD" < /sql/migrate.sql
    restart: "no"
    networks:
      - kafka-cdc-net

  order-service:
    build:
      context: ..
      dockerfile: src/backend/order-services/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://order-db:3306/order_db
      SPRING_DATASOURCE_USERNAME: order_app
      SPRING_DATASOURCE_PASSWORD: order_password
      SERVER_PORT: "8080"
    depends_on:
      order-db:
        condition: service_healthy
      order-db-init:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:8080:8080"
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  inventory-db:
    image: mariadb:11.4
    command:
      - mariadbd
      - --server-id=2
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-legacy-event-pos=1
      - --log-bin-compress=0
    environment:
      MARIADB_ROOT_PASSWORD: local_demo_root_password
      MARIADB_DATABASE: inventory_db
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - inventory-db-data:/var/lib/mysql
      - ./mariadb/inventory/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  inventory-db-init:
    image: mariadb:11.4
    depends_on:
      inventory-db:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: local_demo_root_password
    volumes:
      - ./mariadb/inventory/init.sql:/sql/init.sql:ro
      - ./mariadb/inventory/migrate.sql:/sql/migrate.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mariadb -h inventory-db -uroot -p"$$MARIADB_ROOT_PASSWORD" < /sql/init.sql
        mariadb -h inventory-db -uroot -p"$$MARIADB_ROOT_PASSWORD" < /sql/migrate.sql
    restart: "no"
    networks:
      - kafka-cdc-net

  notification-db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: local_demo_root_password
      MARIADB_DATABASE: notification_db
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - notification-db-data:/var/lib/mysql
      - ./mariadb/notification/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  notification-db-init:
    image: mariadb:11.4
    depends_on:
      notification-db:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: local_demo_root_password
    volumes:
      - ./mariadb/notification/init.sql:/sql/init.sql:ro
      - ./mariadb/notification/migrate.sql:/sql/migrate.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mariadb -h notification-db -uroot -p"$$MARIADB_ROOT_PASSWORD" < /sql/init.sql
        mariadb -h notification-db -uroot -p"$$MARIADB_ROOT_PASSWORD" < /sql/migrate.sql
    restart: "no"
    networks:
      - kafka-cdc-net

  inventory-service:
    build:
      context: ..
      dockerfile: src/backend/inventory-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://inventory-db:3306/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_app
      SPRING_DATASOURCE_PASSWORD: inventory_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEMO_KAFKA_ORDER_TOPIC: order_cdc.order_db.orders
    depends_on:
      inventory-db:
        condition: service_healthy
      inventory-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1::8080"
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  notification-service:
    build:
      context: ..
      dockerfile: src/backend/notification-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://notification-db:3306/notification_db
      SPRING_DATASOURCE_USERNAME: notification_app
      SPRING_DATASOURCE_PASSWORD: notification_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEMO_KAFKA_INVENTORY_TOPIC: inventory_cdc.inventory_db.reservations
    depends_on:
      notification-db:
        condition: service_healthy
      notification-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:8090:8080"
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  topic-init:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic order_cdc.order_db.orders --partitions 3 --replication-factor 1 \
          --config cleanup.policy=delete --config retention.ms=-1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic schema-changes.order --partitions 1 --replication-factor 1 \
          --config cleanup.policy=delete --config retention.ms=-1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic inventory_cdc.inventory_db.reservations --partitions 1 --replication-factor 1 \
          --config cleanup.policy=delete --config retention.ms=-1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic schema-changes.inventory --partitions 1 --replication-factor 1 \
          --config cleanup.policy=delete --config retention.ms=-1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic connect-configs --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic connect-offsets --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic connect-status --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact
    restart: "no"
    networks:
      - kafka-cdc-net

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      order-db:
        condition: service_healthy
      order-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      inventory-db-init:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_PARTITIONS: "1"
      STATUS_STORAGE_PARTITIONS: "1"
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    networks:
      - kafka-cdc-net

  connector-init:
    image: curlimages/curl:8.10.1
    depends_on:
      debezium-connect:
        condition: service_started
    volumes:
      - ./connectors/order-connector.json:/connector/order-connector.json:ro
      - ./connectors/inventory-connector.json:/connector/inventory-connector.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        connect_url=http://debezium-connect:8083
        attempt=0
        until curl -fsS "$$connect_url/connectors" >/dev/null; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "Kafka Connect REST API did not become ready" >&2
            exit 1
          fi
          sleep 2
        done

        curl -fsS -X PUT \
          -H "Content-Type: application/json" \
          --data-binary @/connector/order-connector.json \
          "$$connect_url/connectors/order-connector/config"

        curl -fsS -X PUT \
          -H "Content-Type: application/json" \
          --data-binary @/connector/inventory-connector.json \
          "$$connect_url/connectors/inventory-connector/config"

        for connector_name in order-connector inventory-connector; do
          attempt=0
          while [ "$$attempt" -lt 60 ]; do
            status=$$(curl -fsS "$$connect_url/connectors/$$connector_name/status" 2>/dev/null || true)
            if printf '%s' "$$status" | grep -Fq '"tasks":[{"id":0,"state":"RUNNING"'; then
              echo "$$connector_name is RUNNING"
              break
            fi
            attempt=$$((attempt + 1))
            sleep 2
          done

          if [ "$$attempt" -ge 60 ]; then
            echo "$$connector_name did not become RUNNING; last status:" >&2
            printf '%s\n' "$$status" >&2
            exit 1
          fi
        done
    restart: "no"
    networks:
      - kafka-cdc-net

volumes:
  order-db-data:
  inventory-db-data:
  notification-db-data:
  kafka-data:

networks:
  kafka-cdc-net:
    driver: bridge
